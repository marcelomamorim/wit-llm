site_name: wit-llm
site_url: https://marcelomamorim.github.io/wit-llm/
site_description: >-
  CLI em Go para estudar geração de testes Java com LLMs, contexto WIT
  e avaliação de impacto no OpenJDK/JDK.

repo_name: marcelomamorim/wit-llm
repo_url: https://github.com/marcelomamorim/wit-llm

theme:
  name: material
  custom_dir: docs/overrides
  language: pt-BR
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Modo escuro
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Modo claro
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tabs
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Início: index.md
  - Pesquisa:
    - Método experimental: studies/metodo.md
    - Métricas e análise: studies/metricas.md
    - Reprodutibilidade: studies/reprodutibilidade.md
    - Piloto histórico no JDK: studies/jdk-global-impact.md
  - Arquitetura do experimento: architecture/index.md
  - Uso da ferramenta:
    - Visão geral: overview/index.md
    - Primeiros passos: overview/getting-started.md
    - Configuração: overview/configuration.md
    - CLI e comandos: cli/index.md
    - Integração com modelos: llm/client.md
  - Referência:
    - Catálogo: cataloging/index.md
    - Executor de métricas: cataloging/metrics.md
    - Glossário: glossary.md
